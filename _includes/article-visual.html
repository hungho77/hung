<figure id="concept-visual" class="article-visual visual-{{ page.visual_type }}" data-article-visual data-visual-kind="{{ page.visual_type }}">
  <header class="visual-header">
    <div><span>CONCEPT VISUAL · {{ page.paper_year }}</span><strong>{{ page.visual_title }}</strong></div>
    <span class="visual-mode"><i aria-hidden="true"></i> Select a component</span>
  </header>
  <div class="visual-canvas" role="group" aria-label="{{ page.visual_alt }}">
    {% case page.visual_type %}
    {% when 'quant-map' %}
      <div class="qm-mapping" data-visual-step="1">
        <div class="qm-real visual-panel"><small>01 · REAL TENSOR x</small><div>{% for i in (1..9) %}<i></i>{% endfor %}</div><b>continuous values</b></div>
        <div class="qm-operator"><code>xq = round(clip(x / s))</code><span>scale · clip · round</span><i>→</i></div>
        <div class="qm-codes visual-panel"><small>02 · QUANTIZED CODES xq</small><div>{% for i in (1..16) %}<i></i>{% endfor %}</div><b>finite codebook</b></div>
      </div>
      <div class="qm-formats" data-visual-step="2">
        <div><small>INT8</small><strong>256</strong><span>uniform integer codes</span></div>
        <div><small>FP8 E4M3</small><strong>8 bit</strong><span>non-uniform floating point</span></div>
        <div><small>INT4</small><strong>16</strong><span>weight-only · block 64/128</span></div>
        <div><small>NVFP4</small><strong>E2M1</strong><span>dynamic · block 16</span></div>
      </div>
      <div class="qm-contract visual-panel" data-visual-step="3"><span>FP tensor</span><i>Q</i><b>low-precision tensor + scale</b><i>DQ</i><span>compute input</span></div>
      <div class="qm-kernel-gate" data-visual-step="4"><small>04 · DEPLOYMENT GATE</small><div><span>packed storage</span><i>+</i><span>supported operator</span><i>+</i><span>native kernel</span></div><strong>MEASURED LATENCY ↓</strong></div>
    {% when 'attention' %}
      <div class="attn-projections visual-panel" data-visual-step="1"><small>01 · LEARNED PROJECTIONS</small><div class="attn-token-row"><b>x₁</b><b>x₂</b><b>x₃</b><b>x₄</b></div><div class="attn-qkv-row"><span>Q = XWQ</span><span>K = XWK</span><span>V = XWV</span></div></div>
      <div class="attn-score visual-panel" data-visual-step="2"><header><small>02 · SCALED SCORES</small><strong>QKᵀ / √dk</strong></header><div class="attn-score-grid">{% for i in (1..16) %}<i></i>{% endfor %}</div><span>future positions → −∞</span></div>
      <div class="attn-softmax" data-visual-step="3"><small>03 · ROW SOFTMAX</small><div><i style="--p:12%"></i><i style="--p:21%"></i><i style="--p:18%"></i><i style="--p:49%"></i></div><strong>Σ p = 1</strong></div>
      <div class="attn-value-mix visual-panel" data-visual-step="4"><small>04 · WEIGHTED VALUES</small><code>z = Σ pᵢvᵢ</code><div><span>p₁V₁</span><span>p₂V₂</span><span>p₃V₃</span><span>p₄V₄</span></div></div>
      <div class="attn-heads" data-visual-step="5"><div><i>h₁</i><i>h₂</i><i>h₃</i><i>h₄</i></div><span>concat</span><strong>MultiHead(Q,K,V) · WO</strong></div>
    {% when 'int8' %}
      <div class="i8-histogram visual-panel" data-visual-step="1"><header><small>01 · CALIBRATION HISTOGRAM</small><strong>activation samples</strong></header><div class="i8-bars">{% for i in (1..21) %}<i></i>{% endfor %}</div><span class="i8-threshold i8-percentile">P99.99</span><span class="i8-threshold i8-max">MAX</span></div>
      <div class="i8-range-choice" data-visual-step="2"><div><small>MAX</small><b>no clipping</b><span>coarse steps</span></div><div class="is-chosen"><small>ENTROPY / PERCENTILE</small><b>controlled clipping</b><span>finer common values</span></div></div>
      <div class="i8-affine visual-panel" data-visual-step="3"><small>03 · RANGE MAPPING</small><code>xq = clip(round(sx + z), −128, 127)</code><div class="i8-code-line">{% for i in (1..11) %}<i></i>{% endfor %}</div><span>dequantize: x̂ = (xq − z) / s</span></div>
      <div class="i8-granularity" data-visual-step="4"><small>04 · GRANULARITY</small><div><span>one tensor</span><b>s</b></div><i>→</i><div class="i8-channel-scales"><span>per channel</span><b>s₁</b><b>s₂</b><b>s₃</b><b>s₄</b></div></div>
      <div class="i8-recovery" data-visual-step="5"><small>05 · RECOMMENDED WORKFLOW</small><span>PTQ calibration</span><i>→</i><span>sensitivity analysis</span><i>→</i><span>partial INT8</span><i>→</i><span>QAT if needed</span></div>
    {% when 'smoothquant' %}
      <div class="sq-stage sq-before visual-panel" data-visual-step="1">
        <header><small>BEFORE · X</small><strong>ACTIVATIONS</strong><em>HARD</em></header>
        <div class="sq-chart sq-before-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <p>One outlier channel stretches the whole INT8 range.</p>
      </div>
      <div class="sq-transform" data-visual-step="2">
        <small>PER-CHANNEL · OFFLINE</small>
        <strong>X̂ = X · diag(s)⁻¹</strong>
        <div class="sq-transfer-track" aria-hidden="true"><i></i><span>difficulty</span></div>
        <strong>Ŵ = diag(s) · W</strong>
        <code>sⱼ = max|Xⱼ|ᵅ / max|Wⱼ|¹⁻ᵅ</code>
      </div>
      <div class="sq-stage sq-after visual-panel" data-visual-step="3">
        <header><small>AFTER · X̂</small><strong>ACTIVATIONS</strong><em>EASY</em></header>
        <div class="sq-chart sq-after-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <p>Outlier variance is reduced; INT8 levels cover useful values.</p>
      </div>
      <div class="sq-weight-path visual-panel" data-visual-step="2">
        <div><small>W · BEFORE</small><div class="sq-weight-bars sq-weight-before" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><b>EASY</b></div>
        <span>scale variance →</span>
        <div><small>Ŵ · ADJUSTED</small><div class="sq-weight-bars sq-weight-after" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><b>STILL EASY</b></div>
      </div>
      <div class="sq-equivalence" data-visual-step="3"><span>Y = XW = X̂Ŵ</span><strong>same output · W8A8-ready</strong><small>s is fused offline; no runtime activation scaling</small></div>
    {% when 'gptq' %}
      <div class="gptq-objective visual-panel" data-visual-step="1">
        <small>LAYER RECONSTRUCTION OBJECTIVE</small>
        <strong>min ‖WX − QX‖²</strong>
        <span>H = 2XXᵀ + λI</span>
      </div>
      <div class="gptq-procedure" data-visual-step="2">
        <div class="gptq-hessian visual-panel">
          <header><small>INVERSE LAYER HESSIAN</small><strong>CHOLESKY FORM</strong></header>
          <div class="gptq-cholesky" aria-hidden="true">{% for i in (1..8) %}<i{% if i == 5 %} class="gptq-active-hessian"{% endif %}></i>{% endfor %}</div>
          <code>R = chol(H⁻¹)ᵀ</code>
          <span>computed once</span>
        </div>
        <div class="gptq-coupling" aria-hidden="true"><span>guides</span><i>↔</i></div>
        <div class="gptq-weight-matrix visual-panel">
          <header><small>WEIGHT MATRIX · ALL ROWS</small><strong>ONE SHARED COLUMN ORDER</strong></header>
          <div class="gptq-matrix-track">
            <div class="gptq-done" aria-label="Already quantized columns">
              {% for c in (1..2) %}<span class="gptq-col">{% for r in (1..5) %}<i></i>{% endfor %}</span>{% endfor %}
            </div>
            <div class="gptq-active-block" aria-label="Current block of columns">
              <span class="gptq-col gptq-block-done">{% for r in (1..5) %}<i></i>{% endfor %}</span>
              <span class="gptq-col gptq-current-col">{% for r in (1..5) %}<i></i>{% endfor %}</span>
              <span class="gptq-col gptq-block-pending">{% for r in (1..5) %}<i></i>{% endfor %}</span>
              <span class="gptq-local-flow" aria-hidden="true"><i></i></span>
            </div>
            <div class="gptq-remaining" aria-label="Remaining full precision columns">
              {% for c in (1..3) %}<span class="gptq-col">{% for r in (1..5) %}<i></i>{% endfor %}</span>{% endfor %}
              <span class="gptq-global-flow" aria-hidden="true"><i></i></span>
            </div>
          </div>
          <div class="gptq-legend"><span><i class="done"></i>quantized</span><span><i class="current"></i>current column</span><span><i class="remaining"></i>updated later</span></div>
        </div>
      </div>
      <div class="gptq-algorithm" data-visual-step="3">
        <div class="gptq-quantize-step"><small>01 · COLUMN</small><strong>Q[:,j] ← quant(W[:,j])</strong><span>Quantize this column across every row.</span></div>
        <div class="gptq-local-step"><small>02 · INSIDE BLOCK</small><strong>W[:,j:B] ← W − eⱼR[j,j:B]</strong><span>Compensate only later columns in the active block.</span></div>
        <div class="gptq-global-step"><small>03 · LAZY UPDATE</small><strong>W[:,B:] ← W − ER[B,B:]</strong><span>After the block, update all remaining columns with one matrix operation.</span></div>
      </div>
    {% when 'awq' %}
      <div class="awq-paper-flow" data-visual-step="1">
        <div class="awq-activation-stats visual-panel">
          <header><small>01 · ACTIVATION STATISTICS</small><strong>s<sub>X,c</sub> = mean |X<sub>c</sub>|</strong></header>
          <div class="awq-activation-bars" aria-label="Average activation magnitude per input channel">
            {% for c in (1..8) %}<span><i></i><b>c{{ c }}</b></span>{% endfor %}
          </div>
          <p>Large activation magnitude marks the important input channels.</p>
        </div>
        <div class="awq-channel-link" aria-hidden="true"><span>same input channel</span><i>→</i></div>
        <div class="awq-salient-map visual-panel">
          <header><small>02 · WEIGHT SALIENCY</small><strong>columns of W</strong></header>
          <div class="awq-weight-columns" aria-label="Weight matrix columns aligned with activation channels">
            {% for c in (1..8) %}<span>{% for r in (1..4) %}<i></i>{% endfor %}<b>c{{ c }}</b></span>{% endfor %}
          </div>
          <p><b>0.1–1%</b> FP16 was the diagnostic experiment—not the deployed format.</p>
        </div>
      </div>
      <div class="awq-alpha-search visual-panel" data-visual-step="2">
        <header><small>03 · DATA-DRIVEN SEARCH</small><strong>s = s<sub>X</sub><sup>α</sup></strong></header>
        <div class="awq-search-plot" aria-label="Grid search over alpha from zero to one">
          <span style="--x:0%;--y:70%"><i></i><b>0</b></span>
          <span style="--x:25%;--y:43%"><i></i><b>.25</b></span>
          <span class="is-optimal" style="--x:50%;--y:18%"><i></i><b>α*</b></span>
          <span style="--x:75%;--y:40%"><i></i><b>.75</b></span>
          <span style="--x:100%;--y:63%"><i></i><b>1</b></span>
          <em aria-hidden="true"></em>
        </div>
        <code>α* = arg min ‖Q(W·diag(s))diag(s)⁻¹X − WX‖</code>
        <p>Search balances salient-channel protection against extra error elsewhere.</p>
      </div>
      <div class="awq-scale-transform visual-panel" data-visual-step="3">
        <header><small>04 · EQUIVALENT TRANSFORM</small><strong>scale before quantization</strong></header>
        <div class="awq-transform-equation">
          <div class="awq-transform-side awq-weight-scale"><span>W′</span><b>W · diag(s)</b><small>salient columns ↑</small></div>
          <i>×</i>
          <div class="awq-transform-side awq-activation-scale"><span>X′</span><b>diag(s)⁻¹ · X</b><small>same channels ↓</small></div>
          <i>=</i>
          <div class="awq-invariant"><span>Y</span><b>W′X′ = WX</b><small>full-precision output unchanged</small></div>
        </div>
        <div class="awq-error-ratio"><span>salient error ratio</span><strong>≈ 1 / s</strong><i>when Δ′ ≈ Δ</i></div>
      </div>
      <div class="awq-uniform-output" data-visual-step="4">
        <div class="awq-packed-grid" aria-label="Every weight stored in one uniform low-bit format">{% for i in (1..24) %}<i></i>{% endfor %}</div>
        <div><small>05 · DEPLOYED REPRESENTATION</small><strong>ALL WEIGHTS · INT4</strong><span>activations FP16 · regular W4A16 kernel</span></div>
        <b>no mixed precision</b>
      </div>
    {% when 'lut' %}
      <div class="lut-bcq visual-panel" data-visual-step="1"><small>01 · EXTENDED BCQ WEIGHTS</small><code>Ŵ = α₀B₀ + α₁B₁ + … + z</code><div><span><b>α₀</b><i>1011</i></span><span><b>α₁</b><i>0110</i></span><span><b>bias</b><i>z</i></span></div></div>
      <div class="lut-activation visual-panel" data-visual-step="2"><small>02 · ACTIVATION SUBVECTOR · μ=4</small><div><b>x₀</b><b>x₁</b><b>x₂</b><b>x₃</b></div><span>build every signed partial sum once</span></div>
      <div class="lut-build" data-visual-step="3"><small>03 · 2μ-ENTRY TABLE</small><div>{% for i in (0..15) %}<span><b>{{ i }}</b><i>L{{ i }}</i></span>{% endfor %}</div></div>
      <div class="lut-address visual-panel" data-visual-step="4"><small>04 · PACKED BITS ARE KEYS</small><div><span><b>1011</b><i>→ L11</i></span><span><b>0110</b><i>→ L6</i></span><span><b>1101</b><i>→ L13</i></span></div><p>No FP16 weight vector is reconstructed.</p></div>
      <div class="lut-reduce" data-visual-step="5"><span>retrieve</span><i>→</i><span>Σ partial sums</span><i>→</i><span>× α + bias</span><strong>y = Ŵx</strong></div>
    {% when 'spin' %}
      <div class="spin-distributions" data-visual-step="1"><div class="spin-dist spin-before visual-panel"><small>01 · BEFORE ROTATION</small><div>{% for i in (1..12) %}<i></i>{% endfor %}</div><span>channel outliers · high kurtosis</span></div><i>R</i><div class="spin-dist spin-after visual-panel"><small>AFTER ROTATION</small><div>{% for i in (1..12) %}<i></i>{% endfor %}</div><span>energy spread across coordinates</span></div></div>
      <div class="spin-equivalence visual-panel" data-visual-step="2"><small>02 · ROTATIONAL INVARIANCE</small><div><span>X</span><i>R</i><b>rotated residual</b><i>Rᵀ</i><span>block input</span></div><code>RᵀR = I · full-precision function unchanged</code></div>
      <div class="spin-search" data-visual-step="3"><small>03 · RANDOM IS NOT ENOUGH</small><div class="spin-trials">{% for i in (1..10) %}<i></i>{% endfor %}<b>13-point spread</b></div><span>Cayley SGD searches R on the Stiefel manifold</span><strong>R* = arg min LQ(R)</strong></div>
      <div class="spin-locations" data-visual-step="4"><small>04 · FIGURE 1 ROTATION MAP</small><div><span><b>R1</b> residual</span><span><b>R2</b> V ↔ O</span><span><b>R3</b> KV Hadamard</span><span><b>R4</b> FFN Hadamard</span></div><p><i>R1/R2</i> absorbed into weights · <i>R3/R4</i> remain fast online transforms</p></div>
      <div class="spin-result" data-visual-step="5"><small>05 · TARGET</small><strong>W4A4KV4</strong><span>learn the basis first · quantize second</span></div>
    {% when 'paro' %}
      <div class="paro-balance visual-panel" data-visual-step="1"><small>01 · CHANNEL-WISE SCALE</small><div class="paro-range-before">{% for i in (1..8) %}<i></i>{% endfor %}</div><span>uneven channel ranges</span><div class="paro-range-after">{% for i in (1..8) %}<i></i>{% endfor %}</div><strong>diag(α) equalizes magnitude</strong></div>
      <div class="paro-pairs visual-panel" data-visual-step="2"><small>02 · ONE INDEPENDENT ROTATION</small><div><span><b>c1</b><i>↔</i><b>c6</b></span><span><b>c2</b><i>↔</i><b>c8</b></span><span><b>c3</b><i>↔</i><b>c5</b></span><span><b>c4</b><i>↔</i><b>c7</b></span></div><p>Each channel appears once → every pair runs in parallel.</p></div>
      <div class="paro-givens" data-visual-step="3"><small>03 · 2×2 GIVENS UPDATE</small><div><code>w′ᵢ = cosθ·wᵢ − sinθ·wⱼ</code><code>w′ⱼ = sinθ·wᵢ + cosθ·wⱼ</code></div><span>align values inside each pair · preserve pair norm</span></div>
      <div class="paro-series visual-panel" data-visual-step="4"><small>04 · RESTORE EXPRESSIVENESS</small><div>{% for i in (1..8) %}<span>R{{ i }}</span>{% endfor %}</div><code>T(W) = (Π Rk) · diag(α) · W</code><p>Several independent stages mix different disjoint pairs.</p></div>
      <div class="paro-kernel" data-visual-step="5"><small>05 · FUSED RUNTIME</small><div><span>token parallel</span><span>group parallel</span><span>pair parallel</span></div><i>→</i><strong>ROTATE + INT4 GEMM</strong></div>
    {% when 'vla' %}
      <div class="vperf-timeline visual-panel" data-visual-step="1"><small>01 · SYNCHRONOUS CONTROL LOOP · FIGURE 2</small><div class="vperf-lane"><span>camera frame</span><b class="vp-vision">vision</b><b class="vp-vlm">VLM</b><b class="vp-action">action expert</b><i>execute horizon</i></div><div class="vperf-deadline"><span>next camera frame</span><strong>latency must fit the control budget</strong></div></div>
      <div class="vperf-roofline" data-visual-step="2"><small>02 · OPERATOR ROOFLINE</small><div><span><b>compute</b><i>FLOPs / peak FLOPs</i></span><span><b>memory</b><i>bytes / bandwidth</i></span><span><b>network</b><i>latency + bytes / BW</i></span></div><code>To = max(Tcompute, Tmemory) + Tnetwork</code></div>
      <div class="vperf-breakdown visual-panel" data-visual-step="3"><small>03 · COMPONENT BREAKDOWN</small><div><span><b>VISION</b><i style="--w:72%"></i><em>many image tokens</em></span><span><b>VLM</b><i style="--w:88%"></i><em>backbone + context</em></span><span><b>ACTION</b><i style="--w:46%"></i><em>iterative prediction</em></span></div><p>The limiting resource changes with hardware and model shape.</p></div>
      <div class="vperf-knobs" data-visual-step="4"><small>04 · FIGURE 6 DESIGN KNOBS</small><div><span><b>denoising steps</b><i>10 → 50</i><strong>5× action latency</strong></span><span><b>action chunk</b><i>50 → 250</i><strong>+40% action latency</strong></span></div><p>Repeated model passes cost more than adding tokens to a memory-bound action expert.</p></div>
      <div class="vperf-async" data-visual-step="5"><small>05 · OVERLAP, WITH A COST</small><div><span>upload / infer</span><i></i><span>execute previous chunk</span></div><strong>throughput ↑ · observation staleness ↑</strong></div>
    {% when 'debug' %}
      <div class="dbg-symptom visual-panel" data-visual-step="1"><small>01 · SAME VISIBLE SYMPTOM</small><strong>ENGINE BUILDS ✓</strong><span>generation is nonsense</span><code>Do not diagnose from the final tokens.</code></div>
      <div class="dbg-first-divergence" data-visual-step="2"><small>02 · TRACE THE FIRST WRONG TENSOR</small><div><span>PyTorch reference</span><i>↔</i><span>ONNX export</span><i>↔</i><span>TensorRT layer</span><i>↔</i><span>KV cache / logits</span></div><strong>stop at the earliest cosine collapse</strong></div>
      <div class="dbg-cases" data-visual-step="3"><small>03 · FOUR INDEPENDENT ROOT CAUSES</small><div><span><b>FP16</b><i>Myelin fc_h fusion</i></span><span><b>NVFP4</b><i>CASK ≥2 epilogues</i></span><span><b>INT4 AWQ</b><i>lossy zero-point fold</i></span><span><b>InternVL3</b><i>unmatched checkpoint keys</i></span></div></div>
      <div class="dbg-ab" data-visual-step="4"><small>04 · CHANGE ONE VARIABLE</small><div><span>same graph</span><span>same weights</span><span>same prompt</span><b>one compiler / representation decision</b></div><code>V hidden: cos ≈ .015 → expose V: cos ≈ 1.0</code></div>
      <div class="dbg-proof visual-panel" data-visual-step="5"><small>05 · VERIFY THE FIX</small><div><span>tensor agreement</span><span>correct generation</span><span>latency retained</span><span>maintainer confirmation</span></div><strong>PATCH ONLY AFTER CAUSAL EVIDENCE</strong></div>
    {% endcase %}
  </div>
  <aside class="visual-inspector" data-visual-inspector aria-live="polite">
    <button class="visual-inspector-close" type="button" data-inspector-close aria-label="Close explanation">×</button>
    <div class="visual-inspector-main">
      <span data-inspector-kicker>HOW TO EXPLORE</span>
      <h3 data-inspector-title>Select any outlined component</h3>
      <p data-inspector-description>{{ page.visual_caption }}</p>
    </div>
    <div class="visual-inspector-impact">
      <span>WHY IT MATTERS</span>
      <p data-inspector-impact>The visual stays still until you choose a component. Motion is used once to reveal that component’s role in the system.</p>
    </div>
  </aside>
  <div class="visual-status">
    <span data-visual-status>No component selected</span>
    {% if page.paper_url %}<a href="{{ page.paper_url }}">Interactive redraw · original source ↗</a>{% endif %}
  </div>
  <figcaption><span>HOW TO READ IT</span>{{ page.visual_caption }}</figcaption>
</figure>
