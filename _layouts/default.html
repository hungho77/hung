<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header section-shell"><a class="wordmark" href="{{ '/' | relative_url }}">THH<span>_</span></a><nav><a href="{{ '/' | relative_url }}#systems">Systems</a><a href="{{ '/' | relative_url }}#about">About</a><a href="{{ '/blog/' | relative_url }}">Notes</a><a class="nav-contact" href="mailto:{{ site.author.email }}">Let’s talk ↗</a></nav></header>
  {{ content }}
  <footer class="site-footer section-shell"><div><p class="eyebrow">Have a good one.</p><h2>Let’s make something<br><em>meaningful.</em></h2></div><div class="footer-right"><a class="button button-light" href="mailto:{{ site.author.email }}">Get in touch <span>↗</span></a><p>© {{ 'now' | date: '%Y' }} {{ site.author.name }}<br>Made with care.</p></div></footer>
</body>
</html>
