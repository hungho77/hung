---
layout: default
---
<main class="post-page section-shell">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">← All engineering notes</a>
  <header class="post-header">
    <p class="section-index">{{ page.date | date: "%B %-d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="post-subtitle">{{ page.subtitle }}</p>{% endif %}
    {% if page.tags %}<div class="post-tags post-header-tags">{% for tag in page.tags %}<span>{{ tag }}</span>{% endfor %}</div>{% endif %}
  </header>
  <article class="post-content">{{ content }}</article>
</main>
